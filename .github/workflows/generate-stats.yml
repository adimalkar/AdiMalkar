name: Generate Metrics
on:
  # Run every 6 hours
  schedule:
    - cron: "0 */6 * * *"
  # Allow manual trigger
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Top Languages SVG
        uses: lowlighter/metrics@latest
        with:
          # Use the PAT to read private repositories
          token: ${{ secrets.GH_STATS_TOKEN }}
          
          # Output file
          filename: top-langs.svg
          
          # Disable the base features (we only want the languages card)
          base: ""
          
          # Enable Languages Plugin
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_skipped: adimalkar/Diabetic-Retinopathy-Severity-Classification, adimalkar/Diabetes-Prediction, adimalkar/MA-574-A-PA, adimalkar/Multimodal-Twitter-Sentiment-Analysis, adimalkar/major-financial-data-providers-comparative-analysis, adimalkar/Image_Classification
          extras_css: |
            svg.bar { margin-bottom: 24px !important; }

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_STATS_TOKEN }}
          ref: main

      - name: Update Open Source Contributions Table
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: |
          python3 .github/scripts/update_contributions.py

      - name: Commit and Push README Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md orgs
          if ! git diff --staged --quiet; then
            git commit -m "docs: auto-update open source contributions table [skip ci]"
            git pull --rebase origin main
            git push
          fi
